    class CyberAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      initCtx() {
        if (!this.ctx) {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) {
            this.ctx = new AudioCtxClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playClick() {
        if (!this.enabled) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.04);
          
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {}
      }

      playKeypress() {
        if (!this.enabled) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400 + Math.random() * 200, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.015);
          
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.015);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc.stop(this.ctx.currentTime + 0.015);
        } catch (e) {}
      }

      playCommandRun() {
        if (!this.enabled) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.linearRampToValueAtTime(1200, now + 0.06);
          
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc.stop(now + 0.07);
        } catch (e) {}
      }

      playSuccess() {
        if (!this.enabled) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          
          notes.forEach((freq, idx) => {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + idx * 0.08;
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);
            
            gain.gain.setValueAtTime(0.15, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            osc.start(start);
            osc.stop(start + 0.2);
          });
        } catch (e) {}
      }

      playError() {
        if (!this.enabled) return;

          osc.frequency.linearRampToValueAtTime(110, now + 0.15);
          
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc.stop(now + 0.16);
        } catch (e) {}
      }
    }

    // ==========================================

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeForAttr(str) {
      return JSON.stringify(str);
    }

    function scrollTerminalToBottom() {
      setTimeout(() => {
        const anchor = document.getElementById('terminal-scroll-anchor');
        if (anchor) {
          anchor.scrollIntoView({ behavior: 'smooth' });
        }
      }, 30);
    }

    function bindTerminalListeners() {
      const input = document.getElementById('terminal-cli-input');
      if (!input) return;

      input.addEventListener('keydown', (e) => {
        audioEngine.playKeypress();
        if (e.key === 'Enter') {
          executeTerminalCommand(input.value);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (state.commandHistory.length > 0) {
            const nextIndex = state.historyIndex === -1 ? state.commandHistory.length - 1 : Math.max(0, state.historyIndex - 1);
            state.historyIndex = nextIndex;
            input.value = state.commandHistory[nextIndex];
            state.terminalInput = state.commandHistory[nextIndex];
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (state.historyIndex !== -1) {
            const nextIndex = state.historyIndex + 1;
            if (nextIndex < state.commandHistory.length) {
              state.historyIndex = nextIndex;
              input.value = state.commandHistory[nextIndex];
              state.terminalInput = state.commandHistory[nextIndex];
            } else {
              state.historyIndex = -1;
              input.value = '';
              state.terminalInput = '';
            }
          }
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const tokens = ['help', 'clear', 'whoami', 'ls', 'cat flag.txt', 'skills', 'nmap', 'sudo -l', 'id', 'labs', 'sound', 'matrix', 'history'];
          const val = input.value.trim();
          const match = tokens.find((t) => t.startsWith(val));
          if (match) {
            input.value = match;
            state.terminalInput = match;
          }
        }
      });
    }

        if (state.soundEnabled) audioEngine.playClick();
        renderApp();

        audioEngine.playClick();
        const el = document.getElementById(elementId);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      },

      selectCategory: (cat) => {
        audioEngine.playClick();
        state.selectedCategory = cat;
        renderApp();
        const labsSection = document.getElementById('labs-section');
        if (labsSection) labsSection.scrollIntoView({ behavior: 'smooth' });
      },

        audioEngine.playClick();
        state.selectedCategory = cat;
        renderApp();
      },

      setDifficulty: (diff) => {
        audioEngine.playClick();
        state.selectedDifficulty = diff;
        renderApp();
      },

      setSearchQuery: (query) => {
        state.searchQuery = query;
        renderApp();
        // Restore focus to input after rerender
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.focus();
          searchInput.setSelectionRange(query.length, query.length);
        }
      },

      clearSearch: () => {
        audioEngine.playClick();
        state.searchQuery = '';
        renderApp();
      },

      resetFilters: () => {
        audioEngine.playClick();
        state.searchQuery = '';
        state.selectedCategory = 'All Labs';
        state.selectedDifficulty = 'All';
        renderApp();
      },

      openLab: (labId) => {
        audioEngine.playClick();
        const lab = LABS_DATA.find((l) => l.id === labId);
        if (lab) {
          state.activeLab = lab;
          if (!state.flagInputs[labId]) {
            state.flagInputs[labId] = '';
          }
          renderApp();
        }
      },

      closeLab: () => {
        audioEngine.playClick();
        state.activeLab = null;
        renderApp();
      },

      toggleStep: (labId, stepIdx) => {
        audioEngine.playClick();
        if (!state.completedSteps[labId]) {
          state.completedSteps[labId] = {};
        }
        state.completedSteps[labId][stepIdx] = !state.completedSteps[labId][stepIdx];
        renderApp();
      },

      simulateCommand: (labId, stepIdx) => {
        audioEngine.playCommandRun();
        if (!state.simulatedStepOutputs[labId]) {
          state.simulatedStepOutputs[labId] = {};
        }
        state.simulatedStepOutputs[labId][stepIdx] = true;
        renderApp();
      },

      copyCommand: (text) => {
        audioEngine.playClick();
        navigator.clipboard.writeText(text);
        state.copiedCommand = text;
        renderApp();
        setTimeout(() => {
          if (state.copiedCommand === text) {
            state.copiedCommand = null;
            renderApp();
          }
        }, 2000);
      },

      revealNextHint: (labId, totalHints) => {
        audioEngine.playClick();
        const cur = state.revealedHints[labId] || 0;
        state.revealedHints[labId] = Math.min(cur + 1, totalHints);
        renderApp();
      },

      setFlagInput: (labId, val) => {
        state.flagInputs[labId] = val;

      submitFlag: (labId) => {
        const lab = LABS_DATA.find((l) => l.id === labId);
        if (!lab) return;

        const input = (state.flagInputs[labId] || '').trim();
        if (!input) {
          audioEngine.playError();
          state.flagFeedback[labId] = {
            type: 'error',
            message: 'Please enter a flag token before submitting.'
          };
          renderApp();
          return;
        }

        if (input === lab.flag) {
          audioEngine.playSuccess();
          state.flagFeedback[labId] = {
            type: 'success',
            message: 'ACCESS GRANTED! Flag confirmed. Lab marked as SOLVED.'
          };
          if (!state.solvedLabs.includes(labId)) {
            state.solvedLabs.push(labId);
            saveSolved();
          }
          renderApp();
        } else {
          audioEngine.playError();
          state.flagFeedback[labId] = {
            type: 'error',
            message: 'INVALID FLAG! Verification failed. Check your recon steps or inspect the hint.'
          };
          renderApp();
        }
      },

      runQuickCmd: (cmd) => {
        audioEngine.playClick();
        executeTerminalCommand(cmd);
      },

      toggleTerminalMaximized: () => {
        audioEngine.playClick();
        state.terminalMaximized = !state.terminalMaximized;
        renderApp();
        scrollTerminalToBottom();
      }
    };

    // Initial mount
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
    // In case DOM is already ready
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      renderApp();
    }
  </script>
</body>
</html>
